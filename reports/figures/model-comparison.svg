<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="900" height="300" viewBox="0 0 900 300">
<title id="title">Forward validation RMSPE model comparison</title>
<desc id="desc">Lower is better. History-feature CatBoost scores 0.1611 compared with 0.1753 for the calendar-only baseline, an 8.1 percent reduction.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif;fill:#243447}.muted{fill:#52606d;font-size:13px}.title{font-size:19px;font-weight:600}.value{font-size:15px;font-weight:600}</style>
<text class="title" x="48" y="38">Same 42-day forward holdout · lower is better</text>
<line x1="290.0" y1="76" x2="290.0" y2="230" stroke="#d9dfe5"/>
<text class="muted" x="290.0" y="254" text-anchor="middle">0.00</text>
<line x1="413.8" y1="76" x2="413.8" y2="230" stroke="#d9dfe5"/>
<text class="muted" x="413.8" y="254" text-anchor="middle">0.05</text>
<line x1="537.5" y1="76" x2="537.5" y2="230" stroke="#d9dfe5"/>
<text class="muted" x="537.5" y="254" text-anchor="middle">0.10</text>
<line x1="661.2" y1="76" x2="661.2" y2="230" stroke="#d9dfe5"/>
<text class="muted" x="661.2" y="254" text-anchor="middle">0.15</text>
<line x1="785.0" y1="76" x2="785.0" y2="230" stroke="#d9dfe5"/>
<text class="muted" x="785.0" y="254" text-anchor="middle">0.20</text>
<text x="48" y="112" font-size="15">Calendar CatBoost baseline</text>
<rect x="290" y="91" width="433.9" height="30" rx="3" fill="#96a1ad"/>
<text class="value" x="733.9" y="111">0.1753</text>
<text x="48" y="187" font-size="15">History-feature CatBoost</text>
<rect x="290" y="166" width="398.6" height="30" rx="3" fill="#1f77b4"/>
<text class="value" x="698.6" y="186">0.1611</text>
<text x="785" y="286" text-anchor="end" fill="#1f77b4" font-size="14" font-weight="600">8.1% lower RMSPE</text>
</svg>